<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EARIAL MAHALLU - View Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #3b82f6;
            --dark: #1e293b;
            --light: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.9);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Styles */
        .app-header {
            background: var(--white);
            padding: 30px;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
        }
        .app-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }
        .app-header h1 {
            color: var(--dark);
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .app-header p {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--white);
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            text-align: center;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card .icon { font-size: 24px; margin-bottom: 10px; display: block; }
        .stat-card h3 {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
            color: var(--dark);
        }
        .stat-card.primary .value { color: var(--primary); }
        .stat-card.secondary .value { color: var(--secondary); }

        /* Search & Filter Bar */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            background: var(--white);
            padding: 15px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            position: sticky;
            top: 20px;
            z-index: 100;
        }
        .search-box { flex: 2; position: relative; }
        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); }
        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.5;
        }
        .filter-box { flex: 1; }
        .filter-box select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: white;
            font-size: 16px;
            cursor: pointer;
            outline: none;
        }

        /* Results List */
        .family-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .family-card {
            background: var(--white);
            border-radius: 18px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .family-card::after {
            content: 'VIEW DETAILS →';
            position: absolute;
            bottom: -40px;
            right: 25px;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            transition: bottom 0.3s;
        }
        .family-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }
        .family-card:hover::after { bottom: 20px; }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        .house-no {
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            color: var(--dark);
        }
        .family-card h4 {
            font-size: 18px;
            color: var(--dark);
            margin-bottom: 5px;
        }
        .family-info p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .modal-content {
            background: var(--white);
            max-width: 900px;
            width: 100%;
            margin: auto;
            border-radius: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .modal-body { padding: 40px; }
        .close-btn {
            position: absolute;
            right: 25px;
            top: 20px;
            font-size: 32px;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
            z-index: 10;
        }
        .close-btn:hover { color: var(--dark); }

        /* Report Styles for Print/PDF */
        .report-header {
            text-align: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .report-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .info-item b { color: var(--text-muted); font-size: 12px; text-transform: uppercase; display: block; margin-bottom: 2px; }
        .info-item span { color: var(--dark); font-weight: 600; font-size: 16px; }

        .members-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .members-table th {
            background: #f8fafc;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .members-table td {
            padding: 12px;
            border-top: 1px solid #e2e8f0;
            font-size: 14px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s;
        }
        .btn-action:hover { background: var(--primary-dark); transform: scale(1.02); }

        /* Loading Spinner */
        .loader-container {
            text-align: center;
            padding: 50px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .report-grid { grid-template-columns: 1fr; }
            .modal-body { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="app-header">
        <h1>EARIAL MAHALLU MUSLIM JAMA-ATH</h1>
        <p>Reg.No: 361/86, Po. Muthuvadathoor, Kozhikode, Kerala - 673503</p>
    </header>

    <div class="stats-grid">
        <div class="stat-card primary">
            <span class="icon">🏠</span>
            <h3>ആകെ വീടുകൾ</h3>
            <div class="value" id="totalHouses">0</div>
        </div>
        <div class="stat-card secondary">
            <span class="icon">👥</span>
            <h3>ആകെ അംഗങ്ങൾ</h3>
            <div class="value" id="totalMembers">0</div>
        </div>
        <div class="stat-card">
            <span class="icon">👨</span>
            <h3>പുരുഷന്മാർ</h3>
            <div class="value" id="totalMales">0</div>
        </div>
        <div class="stat-card">
            <span class="icon">👩</span>
            <h3>സ്ത്രീകൾ</h3>
            <div class="value" id="totalFemales">0</div>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="പേര് അല്ലെങ്കിൽ വീട്ടുനമ്പർ നൽകി തിരയുക..." onkeyup="filterData()">
        </div>
        <div class="filter-box">
            <select id="placeFilter" onchange="filterData()">
                <option value="">എല്ലാ ഏരിയകളും</option>
                <option value="വണ്ണാറത്ത് ഭാഗം">വണ്ണാറത്ത് ഭാഗം</option>
                <option value="ഒറ്റക്കണ്ടി ഭാഗം">ഒറ്റക്കണ്ടി ഭാഗം</option>
                <option value="പള്ളി ഭാഗം">പള്ളി ഭാഗം</option>
                <option value="കല്ലിൽ ഭാഗം">കല്ലിൽ ഭാഗം</option>
                <option value="പുതിയടത്തിൽ ഭാഗം">പുതിയടത്തിൽ ഭാഗം</option>
                <option value="മാലോൽ ഭാഗം">മാലോൽ ഭാഗം</option>
                <option value="അരാംവള്ളി ഭാഗം">അരാംവള്ളി ഭാഗം</option>
                <option value="ലക്ഷം വീട് ഭാഗം">ലക്ഷം വീട് ഭാഗം</option>
            </select>
        </div>
    </div>

    <div id="loader" class="loader-container">
        <div class="spinner"></div>
        <p>വിവരങ്ങൾ ശേഖരിക്കുന്നു, ദയവായി കാത്തിരിക്കുക...</p>
    </div>

    <div id="familyDisplay" class="family-list"></div>
</div>

<!-- Details Modal -->
<div id="viewModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-body">
            <div id="printContent">
                <!-- Content will be injected here -->
            </div>
            <button class="btn-action" onclick="generatePDF()">
                <span>📄</span> PDF ഡൗൺലോഡ് ചെയ്യുക
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAoVl_v1w0LWWENZ68q7HA6PBD0HZluG9Y",
        authDomain: "mahall-f0305.firebaseapp.com",
        projectId: "mahall-f0305",
        storageBucket: "mahall-f0305.firebasestorage.app",
        messagingSenderId: "1094550689039",
        appId: "1:1094550689039:web:98302a4c3f95cbaa005a7a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allFamilies = [];

    async function fetchData() {
        const loader = document.getElementById('loader');
        const display = document.getElementById('familyDisplay');
        
        try {
            const q = query(collection(db, "MahallCensusData"));
            const snap = await getDocs(q);
            
            if (snap.empty) {
                display.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; background: white; border-radius: 20px;">
                    <p style="font-size: 18px; color: var(--text-muted);">വിവരങ്ങൾ ഒന്നും ലഭ്യമല്ല. ഡാറ്റാബേസ് പരിശോധിക്കുക.</p>
                </div>`;
                loader.style.display = 'none';
                return;
            }

            allFamilies = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

            // Standardize houseNumber for sorting
            allFamilies.sort((a, b) => {
                const numA = parseInt(a.houseNumber) || 0;
                const numB = parseInt(b.houseNumber) || 0;
                return numA - numB;
            });

            updateStats(allFamilies);
            renderFamilies(allFamilies);
            loader.style.display = 'none';

        } catch (error) {
            console.error("Firebase Error:", error);
            display.innerHTML = `<div style="grid-column: 1/-1; color: #ef4444; text-align: center; padding: 40px; background: white; border-radius: 20px;">
                <p>കണക്ഷൻ എറർ: ${error.message}</p>
                <button onclick="location.reload()" style="margin-top:15px; padding:8px 20px; border-radius:8px; border:none; background:#ef4444; color:white; cursor:pointer;">വീണ്ടും ശ്രമിക്കുക</button>
            </div>`;
            loader.style.display = 'none';
        }
    }

    function updateStats(data) {
        document.getElementById('totalHouses').innerText = data.length;
        let membersCount = 0;
        let males = 0;
        let females = 0;

        data.forEach(f => {
            if (f.members) {
                membersCount += f.members.length;
                f.members.forEach(m => {
                    if (m.gender === 'പുരുഷൻ') males++;
                    else if (m.gender === 'സ്ത്രീ') females++;
                });
            }
        });

        document.getElementById('totalMembers').innerText = membersCount;
        document.getElementById('totalMales').innerText = males;
        document.getElementById('totalFemales').innerText = females;
    }

    function renderFamilies(data) {
        const container = document.getElementById('familyDisplay');
        container.innerHTML = '';

        data.forEach(f => {
            container.innerHTML += `
                <div class="family-card" onclick="openDetails('${f.id}')">
                    <div class="card-header">
                        <span class="house-no"># ${f.houseNumber || 'NA'}</span>
                        <span style="font-size:12px; color:var(--primary); font-weight:600;">${f.place || ''}</span>
                    </div>
                    <h4>${f.houseName}</h4>
                    <div class="family-info">
                        <p>👤 <b>${f.Name}</b></p>
                        <p>📞 ${f.mobile || '-'}</p>
                        <p>👨‍👩‍👧‍👦 ${f.members ? f.members.length : 0} അംഗങ്ങൾ</p>
                    </div>
                </div>
            `;
        });
    }

    window.filterData = () => {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const place = document.getElementById('placeFilter').value;

        const filtered = allFamilies.filter(f => {
            const matchesSearch = 
                (f.houseName && f.houseName.toLowerCase().includes(search)) || 
                (f.Name && f.Name.toLowerCase().includes(search)) ||
                (f.houseNumber && f.houseNumber.toString().includes(search));
            
            const matchesPlace = !place || f.place === place;

            return matchesSearch && matchesPlace;
        });

        renderFamilies(filtered);
    }

    window.openDetails = (id) => {
        const f = allFamilies.find(x => x.id === id);
        if (!f) return;

        const printArea = document.getElementById('printContent');
        let membersRows = '';
        
        if (f.members) {
            f.members.forEach((m, i) => {
                membersRows += `
                    <tr>
                        <td>${i+1}</td>
                        <td>${m.name}</td>
                        <td>${m.relation || '-'}</td>
                        <td>${m.gender || '-'}</td>
                        <td>${m.age || '-'}</td>
                        <td>${m.job || '-'}</td>
                        <td>${m.mobile || '-'}</td>
                    </tr>
                `;
            } );
        }

        printArea.innerHTML = `
            <div class="report-header">
                <h2 style="color:var(--dark); margin-bottom:5px;">EARIAL MAHALLU MUSLIM JAMA-ATH</h2>
                <p style="color:var(--text-muted); font-size:14px;">കുടുംബ സെൻസസ് രേഖ - 2024</p>
            </div>
            
            <div class="report-grid">
                <div class="info-item"><b>മഹല്ല് വീട്ടുനമ്പർ</b><span>${f.houseNumber || 'Nil'}</span></div>
                <div class="info-item"><b>കുടുംബ പേര്</b><span>${f.houseName || 'Nil'}</span></div>
                <div class="info-item"><b>ഗൃഹനാഥൻ</b><span>${f.Name || 'Nil'}</span></div>
                <div class="info-item"><b>പിതാവ്</b><span>${f.father || 'Nil'}</span></div>
                <div class="info-item"><b>വാർഡ് / കെട്ടിട നമ്പർ</b><span>${f.ward || 'Nil'}</span></div>
                <div class="info-item"><b>മൊബൈൽ</b><span>${f.mobile || 'Nil'}</span></div>
                <div class="info-item"><b>റേഷൻ കാർഡ്</b><span>${f.rationCard || 'Nil'}</span></div>
                <div class="info-item"><b>ഏരിയ / സ്ഥലം</b><span>${f.place || 'Nil'}</span></div>
            </div>

            <div style="margin-top:20px;">
                <h3 style="font-size:16px; border-left:4px solid var(--primary); padding-left:10px; margin-bottom:15px;">അംഗങ്ങളുടെ വിവരങ്ങൾ</h3>
                <table class="members-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>പേര്</th>
                            <th>ബന്ധം</th>
                            <th>ലിംഗം</th>
                            <th>വയസ്സ്</th>
                            <th>ജോലി</th>
                            <th>മൊബൈൽ</th>
                        </tr>
                    </thead>
                    <tbody>${membersRows || '<tr><td colspan="7" style="text-align:center">അംഗങ്ങളുടെ വിവരങ്ങൾ ലഭ്യമല്ല</td></tr>'}</tbody>
                </table>
            </div>
            
            <div style="margin-top:25px; padding:15px; background:#f8fafc; border-radius:12px;">
                <b style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:5px;">REMARKS / കുറിപ്പുകൾ:</b>
                <p style="font-size:14px;">${f.remarks || 'ഒന്നുമില്ല'}</p>
            </div>
        `;
        document.getElementById('viewModal').style.display = 'flex';
    }

    window.closeModal = () => {
        document.getElementById('viewModal').style.display = 'none';
    }

    window.generatePDF = () => {
        const element = document.getElementById('printContent');
        const opt = {
            margin: 10,
            filename: `Mahall_Report.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    window.onclick = (e) => {
        if (e.target.className === 'modal') closeModal();
    }

    fetchData();
</script>

</body>
</html>
