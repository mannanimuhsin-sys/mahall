<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EARIAL MAHALLU - View Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #3b82f6;
            --dark: #1e293b;
            --light: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.9);
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header Styles */
        .app-header {
            background: var(--white);
            padding: 30px;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
        }
        .app-header h1 {
            color: var(--dark);
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 700;
            margin-bottom: 10px;
        }
        .app-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--white);
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }
        .stat-card h3 { font-size: 14px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .value { font-size: 36px; font-weight: 700; color: var(--dark); }
        .stat-card.primary .value { color: var(--primary); }

        /* Search & Filter Bar */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            background: var(--white);
            padding: 15px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            position: sticky;
            top: 20px;
            z-index: 100;
        }
        .search-box { flex: 2; position: relative; }
        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        .search-box::before { content: '🔍'; position: absolute; left: 20px; top: 50%; transform: translateY(-50%); opacity: 0.5; }
        .filter-box { flex: 1; }
        .filter-box select { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; outline: none; }

        /* Results List */
        .family-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .family-card {
            background: var(--white);
            border-radius: 18px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        .family-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border-color: var(--primary); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .house-no { background: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 14px; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: var(--white);
            max-width: 900px;
            width: 100%;
            margin: auto;
            border-radius: 24px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
        }
        .close-btn { position: absolute; right: 25px; top: 20px; font-size: 32px; cursor: pointer; color: var(--text-muted); }

        .btn-action {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
        }

        /* Status Banner */
        #statusBanner {
            display: none;
            padding: 10px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .status-error { background: #fee2e2; color: #ef4444; }
        .status-loading { background: #e0f2fe; color: #0284c7; }

        @media (max-width: 768px) {
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="app-header">
        <h1>EARIAL MAHALLU MUSLIM JAMA-ATH</h1>
        <p>Census View Portal</p>
    </header>

    <div id="statusBanner"></div>

    <div class="stats-grid">
        <div class="stat-card primary">
            <h3>ആകെ വീടുകൾ</h3>
            <div class="value" id="totalHouses">0</div>
        </div>
        <div class="stat-card">
            <h3>ആകെ അംഗങ്ങൾ</h3>
            <div class="value" id="totalMembers">0</div>
        </div>
        <div class="stat-card">
            <h3>പുരുഷന്മാർ</h3>
            <div class="value" id="totalMales">0</div>
        </div>
        <div class="stat-card">
            <h3>സ്ത്രീകൾ</h3>
            <div class="value" id="totalFemales">0</div>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="പേര് അല്ലെങ്കിൽ വീട്ടുനമ്പർ..." onkeyup="filterData()">
        </div>
        <div class="filter-box">
            <select id="placeFilter" onchange="filterData()">
                <option value="">എല്ലാ ഏരിയകളും</option>
                <option value="വണ്ണാറത്ത് ഭാഗം">വണ്ണാറത്ത് ഭാഗം</option>
                <option value="ഒറ്റക്കണ്ടി ഭാഗം">ഒറ്റക്കണ്ടി ഭാഗം</option>
                <option value="പള്ളി ഭാഗം">പള്ളി ഭാഗം</option>
                <option value="കല്ലിൽ ഭാഗം">കല്ലിൽ ഭാഗം</option>
                <option value="പുതിയടത്തിൽ ഭാഗം">പുതിയടത്തിൽ ഭാഗം</option>
                <option value="മാലോൽ ഭാഗം">മാലോൽ ഭാഗം</option>
                <option value="അരാംവള്ളി ഭാഗം">അരാംവള്ളി ഭാഗം</option>
                <option value="ലക്ഷം വീട് ഭാഗം">ലക്ഷം വീട് ഭാഗം</option>
            </select>
        </div>
    </div>

    <div id="familyDisplay" class="family-list">
        <p style="text-align:center; grid-column: 1/-1; padding: 40px;">വിവരങ്ങൾ ശേഖരിക്കുന്നു...</p>
    </div>
</div>

<div id="viewModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="printContent"></div>
        <button class="btn-action" onclick="generatePDF()">📄 PDF ഡൗൺലോഡ് ചെയ്യുക</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAoVl_v1w0LWWENZ68q7HA6PBD0HZluG9Y",
        authDomain: "mahall-f0305.firebaseapp.com",
        projectId: "mahall-f0305",
        storageBucket: "mahall-f0305.firebasestorage.app",
        messagingSenderId: "1094550689039",
        appId: "1:1094550689039:web:98302a4c3f95cbaa005a7a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allFamilies = [];

    function showStatus(msg, type) {
        const banner = document.getElementById('statusBanner');
        banner.innerText = msg;
        banner.className = 'status-' + type;
        banner.style.display = 'block';
    }

    // Using onSnapshot for real-time and more reliable updates
    function startListening() {
        showStatus("ഡാറ്റാബേസുമായി ബന്ധിപ്പിക്കുന്നു...", "loading");
        
        try {
            const q = query(collection(db, "MahallCensusData"));
            
            onSnapshot(q, (snap) => {
                if (snap.empty) {
                    showStatus("ഡാറ്റാബേസിൽ വിവരങ്ങൾ ഒന്നും കണ്ടെത്തിയില്ല (Empty Collection).", "error");
                    document.getElementById('familyDisplay').innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>വിവരങ്ങൾ ഒന്നും ലഭ്യമല്ല. ഡാറ്റാബേസ് പരിശോധിക്കുക.</p>";
                    return;
                }

                allFamilies = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Numeric sort
                allFamilies.sort((a, b) => (parseInt(a.houseNumber) || 0) - (parseInt(b.houseNumber) || 0));

                updateStats(allFamilies);
                renderFamilies(allFamilies);
                document.getElementById('statusBanner').style.display = 'none';
                
            }, (error) => {
                console.error("Firebase Error:", error);
                showStatus("Error: " + error.message, "error");
            });
        } catch (e) {
            showStatus("System Error: " + e.message, "error");
        }
    }

    function updateStats(data) {
        document.getElementById('totalHouses').innerText = data.length;
        let mCount = 0, males = 0, females = 0;
        data.forEach(f => {
            if (f.members) {
                mCount += f.members.length;
                f.members.forEach(m => {
                    if (m.gender === 'പുരുഷൻ') males++;
                    else if (m.gender === 'സ്ത്രീ') females++;
                });
            }
        });
        document.getElementById('totalMembers').innerText = mCount;
        document.getElementById('totalMales').innerText = males;
        document.getElementById('totalFemales').innerText = females;
    }

    function renderFamilies(data) {
        const container = document.getElementById('familyDisplay');
        container.innerHTML = data.map(f => `
            <div class="family-card" onclick="openDetails('${f.id}')">
                <div class="card-header">
                    <span class="house-no"># ${f.houseNumber || 'NA'}</span>
                    <span style="font-size:12px; color:var(--primary); font-weight:600;">${f.place || ''}</span>
                </div>
                <h4>${f.houseName || 'No Name'}</h4>
                <div style="font-size:14px; color:var(--text-muted);">
                    <p>👤 <b>${f.Name || 'No Name'}</b></p>
                    <p>📞 ${f.mobile || '-'}</p>
                    <p>👥 ${f.members ? f.members.length : 0} അംഗങ്ങൾ</p>
                </div>
            </div>
        `).join('');
    }

    window.filterData = () => {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const place = document.getElementById('placeFilter').value;
        const filtered = allFamilies.filter(f => {
            const matchS = (f.houseName?.toLowerCase().includes(search)) || (f.Name?.toLowerCase().includes(search)) || (f.houseNumber?.toString().includes(search));
            const matchP = !place || f.place === place;
            return matchS && matchP;
        });
        renderFamilies(filtered);
    }

    window.openDetails = (id) => {
        const f = allFamilies.find(x => x.id === id);
        if (!f) return;
        document.getElementById('printContent').innerHTML = `
            <div style="text-align:center; border-bottom:2px solid #eee; padding-bottom:15px; margin-bottom:20px;">
                <h2 style="color:var(--dark);">EARIAL MAHALLU MUSLIM JAMA-ATH</h2>
                <p>കുടുംബ റിപ്പോർട്ട്</p>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:14px;">
                <p><b>വീട്ടുനമ്പർ:</b> ${f.houseNumber}</p>
                <p><b>വീട്ടുപേര്:</b> ${f.houseName}</p>
                <p><b>ഗൃഹനാഥൻ:</b> ${f.Name}</p>
                <p><b>മൊബൈൽ:</b> ${f.mobile}</p>
                <p><b>സ്ഥലം:</b> ${f.place}</p>
            </div>
            <table style="width:100%; border-collapse:collapse; margin-top:20px;">
                <tr style="background:#f8fafc;">
                    <th style="padding:10px; border:1px solid #eee;">പേര്</th>
                    <th style="padding:10px; border:1px solid #eee;">ബന്ധം</th>
                    <th style="padding:10px; border:1px solid #eee;">ലിംഗം</th>
                    <th style="padding:10px; border:1px solid #eee;">വയസ്സ്</th>
                </tr>
                ${(f.members || []).map(m => `
                    <tr>
                        <td style="padding:10px; border:1px solid #eee;">${m.name}</td>
                        <td style="padding:10px; border:1px solid #eee;">${m.relation || '-'}</td>
                        <td style="padding:10px; border:1px solid #eee;">${m.gender || '-'}</td>
                        <td style="padding:10px; border:1px solid #eee;">${m.age || '-'}</td>
                    </tr>
                `).join('')}
            </table>
        `;
        document.getElementById('viewModal').style.display = 'flex';
    }

    window.closeModal = () => document.getElementById('viewModal').style.display = 'none';
    
    window.generatePDF = () => {
        const element = document.getElementById('printContent');
        html2pdf().from(element).save('Mahall_Report.pdf');
    }

    startListening();
</script>
</body>
</html>
