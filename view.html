<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EARIAL MAHALLU MUSLIM JAMA-ATH - View Data</title>
    <style>
        :root { --primary-color: #2c3e50; --secondary-color: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 10px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .header { text-align: center; border-bottom: 3px solid var(--primary-color); margin-bottom: 25px; padding-bottom: 15px; }
        .header h1 { margin: 0; color: var(--primary-color); font-size: clamp(18px, 4vw, 24px); text-transform: uppercase; }
        .header p { margin: 5px 0 0; color: #555; font-size: 14px; font-weight: bold; }
        
        .filters { background: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .filters .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end; }
        .filters input, .filters select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 14px; }
        .filters button { background: var(--secondary-color); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        .data-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .family-card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .family-card h3 { margin: 0 0 10px; color: var(--primary-color); }
        .member { margin-bottom: 8px; padding: 5px; background: #f9f9f9; border-radius: 4px; }
        .member strong { color: var(--secondary-color); }
        
        .no-data { text-align: center; padding: 50px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>EARIAL MAHALLU MUSLIM JAMA-ATH</h1>
        <p>Reg.No: 361/86, Po. Muthuvadathoor, Kozhikode, Kerala - 673503</p>
        <p>വിവരങ്ങൾ കാണുക</p>
    </div>

    <div class="filters">
        <div class="grid">
            <input type="text" id="filterHouseNumber" placeholder="വീട്ടുനമ്പർ അടിക്കുക (എല്ലാം കാണാൻ ശൂന്യമാക്കുക)">
            <select id="filterGender">
                <option value="">എല്ലാം</option>
                <option value="പുരുഷൻ">പുരുഷൻ (ബോയ്സ്)</option>
                <option value="സ്ത്രീ">സ്ത്രീ (ഗേൾസ്)</option>
            </select>
            <select id="filterAge">
                <option value="">എല്ലാ വയസ്സും</option>
                <option value="above40">40-ൽ മുകളിൽ</option>
                <option value="below40">40-ൽ താഴെ</option>
            </select>
            <button onclick="applyFilters()">വ്യൂ</button>
        </div>
    </div>

    <div id="dataContainer" class="data-list">
        <!-- Data will be loaded here -->
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAoVl_v1w0LWWENZ68q7HA6PBD0HZluG9Y",
        authDomain: "mahall-f0305.firebaseapp.com",
        projectId: "mahall-f0305",
        storageBucket: "mahall-f0305.firebasestorage.app",
        messagingSenderId: "1094550689039",
        appId: "1:1094550689039:web:98302a4c3f95cbaa005a7a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allFamilies = [];

    async function loadData() {
        const q = query(collection(db, "MahallCensusData"), orderBy("timestamp", "desc"));
        const snap = await getDocs(q);
        allFamilies = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        
        // Sort by house number numerically
        allFamilies.sort((a, b) => {
            const numA = parseInt(a.houseNumber) || 0;
            const numB = parseInt(b.houseNumber) || 0;
            return numA - numB;
        });
        
        renderData(allFamilies);
    }

    function renderData(data) {
        const container = document.getElementById('dataContainer');
        if (data.length === 0) {
            container.innerHTML = '<div class="no-data">ഡാറ്റ ഇല്ല</div>';
            return;
        }
        
        container.innerHTML = '';
        data.forEach(family => {
            let html = `<div class="family-card">
                <h3>${family.houseName} (${family.houseNumber || 'No Number'})</h3>
                <p><strong>ഗൃഹനാഥൻ:</strong> ${family.Name}</p>
                <p><strong>സ്ഥലം:</strong> ${family.place}</p>
                <p><strong>മൊബൈൽ:</strong> ${family.mobile}</p>`;
            
            if (family.members && family.members.length > 0) {
                html += '<h4>അംഗങ്ങൾ:</h4>';
                family.members.forEach(member => {
                    html += `<div class="member">
                        <strong>${member.name}</strong> (${member.gender}, ${member.age} വയസ്സ്)<br>
                        <small>ബന്ധം: ${member.relation}, ജോലി: ${member.job || 'N/A'}</small>
                    </div>`;
                });
            }
            
            html += '</div>';
            container.innerHTML += html;
        });
    }

    window.applyFilters = function() {
        const houseNumber = document.getElementById('filterHouseNumber').value.trim();
        const gender = document.getElementById('filterGender').value;
        const ageFilter = document.getElementById('filterAge').value;
        
        let filtered = [...allFamilies];
        
        // If house number is specified, show only that family
        if (houseNumber) {
            filtered = filtered.filter(f => f.houseNumber && f.houseNumber.includes(houseNumber));
        } else {
            // If no house number, apply gender and age filters
            if (gender) {
                filtered = filtered.map(family => {
                    if (family.members) {
                        const filteredMembers = family.members.filter(m => m.gender === gender);
                        return { ...family, members: filteredMembers };
                    }
                    return family;
                }).filter(f => f.members && f.members.length > 0);
            }
            
            if (ageFilter) {
                filtered = filtered.map(family => {
                    if (family.members) {
                        const filteredMembers = family.members.filter(m => {
                            const age = parseInt(m.age);
                            if (ageFilter === 'above40') return age > 40;
                            if (ageFilter === 'below40') return age < 40;
                            return true;
                        });
                        return { ...family, members: filteredMembers };
                    }
                    return family;
                }).filter(f => f.members && f.members.length > 0);
            }
        }
        
        renderData(filtered);
    };

    // Load data on page load
    loadData();
</script>
</body>
</html></content>
