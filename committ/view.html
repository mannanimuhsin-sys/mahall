<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EARIAL MAHALLU - View Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #3b82f6;
            --dark: #1e293b;
            --light: #f8fafc;
            --text-main: #334155;
            --text-muted: #64748b;
            --white: #ffffff;
            --border: #e2e8f0;
            --card-shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 4px 10px -6px rgba(0,0,0,0.06);
            --grad: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: var(--text-main);
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 24px 16px; }

        /* ── Header ── */
        .app-header {
            background: var(--white);
            border-radius: 24px;
            padding: 32px 36px;
            box-shadow: var(--card-shadow);
            margin-bottom: 28px;
            text-align: center;
            border-top: 6px solid var(--primary);
            position: relative;
            overflow: hidden;
        }
        .app-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(16,185,129,0.04), transparent 60%);
        }
        .app-header h1 {
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 800;
            color: var(--dark);
            letter-spacing: -0.5px;
        }
        .app-header p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--secondary);
            color: white;
            padding: 8px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-top: 14px;
            transition: all 0.25s;
        }
        .back-btn:hover { opacity: 0.85; transform: translateY(-2px); }

        /* ── Status Banner ── */
        #statusBanner {
            display: none;
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }
        .status-error   { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .status-loading { background: #e0f2fe; color: #0284c7; border: 1px solid #7dd3fc; }

        /* ── Stats Grid ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 18px;
            margin-bottom: 26px;
        }
        .stat-card {
            background: var(--white);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: var(--card-shadow);
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-4px); }
        .stat-card .icon { font-size: 28px; margin-bottom: 6px; }
        .stat-card h3 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 600; }
        .stat-card .value { font-size: 38px; font-weight: 800; color: var(--dark); line-height: 1; }
        .stat-card.green .value  { color: var(--primary); }
        .stat-card.blue .value   { color: var(--secondary); }
        .stat-card.pink .value   { color: #ec4899; }
        .stat-card.orange .value { color: #f59e0b; }

        /* ── Controls ── */
        .controls {
            background: var(--white);
            border-radius: 18px;
            padding: 16px 20px;
            box-shadow: var(--card-shadow);
            margin-bottom: 26px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
            position: sticky;
            top: 16px;
            z-index: 90;
        }
        .controls .search-wrap { flex: 2; min-width: 200px; position: relative; }
        .controls .search-wrap input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }
        .controls .search-wrap input:focus { border-color: var(--primary); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: 0.4; }
        .controls select {
            flex: 1; min-width: 160px;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: white;
            cursor: pointer;
            transition: border 0.2s;
        }
        .controls select:focus { border-color: var(--primary); }
        .result-count {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
            padding: 8px 14px;
            background: var(--light);
            border-radius: 8px;
        }

        /* ── Family Cards Grid ── */
        .family-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
        }
        .family-card {
            background: var(--white);
            border-radius: 18px;
            padding: 22px;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: all 0.28s;
            border: 2px solid transparent;
        }
        .family-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -8px rgba(16,185,129,0.2);
            border-color: var(--primary);
        }
        .fc-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }
        .house-badge {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
        }
        .area-tag {
            font-size: 11px;
            color: var(--primary);
            font-weight: 600;
            background: rgba(16,185,129,0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }
        .house-name { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
        .owner-name { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; }
        .fc-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text-muted);
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .fc-meta span { display: flex; align-items: center; gap: 4px; }

        /* ── No results ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 60px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; margin-bottom: 6px; color: var(--dark); }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.65);
            backdrop-filter: blur(6px);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
            align-items: flex-start;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--white);
            max-width: 960px;
            width: 100%;
            border-radius: 24px;
            position: relative;
            margin: auto;
        }
        .modal-header {
            background: var(--grad);
            color: white;
            padding: 28px 36px;
            border-radius: 24px 24px 0 0;
            position: relative;
        }
        .modal-header h2 { font-size: 20px; font-weight: 700; }
        .modal-header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }
        .modal-close {
            position: absolute;
            right: 20px;
            top: 18px;
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.35); }

        .modal-body { padding: 30px 36px 36px; }

        /* House info grid */
        .info-section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }
        .info-item label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 600;
            margin-bottom: 3px;
        }
        .info-item .val {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
        }
        .info-item .val.empty { color: var(--text-muted); font-weight: 400; }

        /* Members table */
        .members-table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .members-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
            font-size: 13px;
        }
        .members-table thead tr {
            background: #f8fafc;
        }
        .members-table th {
            padding: 12px 14px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid var(--border);
        }
        .members-table td {
            padding: 11px 14px;
            border-bottom: 1px solid #f1f5f9;
            color: var(--text-main);
        }
        .members-table tbody tr:last-child td { border-bottom: none; }
        .members-table tbody tr:hover { background: rgba(16,185,129,0.04); }
        .members-table .row-num {
            background: var(--primary);
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }
        .badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-male   { background: #dbeafe; color: #1d4ed8; }
        .badge-female { background: #fce7f3; color: #be185d; }
        .badge-yes    { background: #fee2e2; color: #dc2626; }
        .badge-blood  { background: #fff7ed; color: #c2410c; }

        /* Remarks */
        .remarks-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Modal footer buttons */
        .modal-footer {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-pdf {
            flex: 1;
            padding: 14px;
            background: var(--grad);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn-pdf:hover { opacity: 0.88; transform: translateY(-2px); }
        .btn-print {
            padding: 14px 22px;
            background: #f1f5f9;
            color: var(--dark);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .btn-print:hover { background: var(--border); }

        @media (max-width: 768px) {
            .controls { flex-direction: column; }
            .modal-body { padding: 20px; }
            .modal-header { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <header class="app-header">
        <h1>🕌 EARIAL MAHALLU MUSLIM JAMA-ATH</h1>
        <p>Census View Portal — എല്ലാ കുടുംബ വിവരങ്ങളും</p>
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap;">
            <a href="index.html" class="back-btn">← Data Entry 1 (Index)</a>
            <a href="mahall.html" class="back-btn" style="background: var(--primary-dark);">← Data Entry 2 (Mahall)</a>

    <!-- Status -->

    <!-- Stats -->
    <div class="stats-grid">

            <div class="value" id="statHouses">—</div>
        </div>
        <div class="stat-card blue">
            <div class="icon">👥</div>
            <h3>ആകെ അംഗങ്ങൾ</h3>
            <div class="value" id="statMembers">—</div>
        </div>
        <div class="stat-card blue">
            <div class="icon">👨</div>
            <h3>പുരുഷന്മാർ</h3>
            <div class="value" id="statMales">—</div>
        </div>
        <div class="stat-card pink">
            <div class="icon">👩</div>
            <h3>സ്ത്രീകൾ</h3>
            <div class="value" id="statFemales">—</div>
        </div>
        <div class="stat-card orange">
            <div class="icon">✈️</div>
            <h3>പ്രവാസികൾ</h3>
            <div class="value" id="statAbroad">—</div>
        </div>
        <div class="stat-card orange">
            <div class="icon">🌙</div>
            <h3>യത്തീമുകൾ</h3>
            <div class="value" id="statOrphans">—</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="പേര്, വീട്ടുപേര്, മൊബൈൽ, വീട്ടുനമ്പർ, സ്കിൽസ്..." oninput="filterData()">
        </div>
        <select id="placeFilter" onchange="filterData()">

            <option value="വണ്ണാറത്ത് ഭാഗം">വണ്ണാറത്ത് ഭാഗം</option>
            <option value="ഒറ്റക്കണ്ടി ഭാഗം">ഒറ്റക്കണ്ടി ഭാഗം</option>
            <option value="പള്ളി ഭാഗം">പള്ളി ഭാഗം</option>
            <option value="കല്ലിൽ ഭാഗം">കല്ലിൽ ഭാഗം</option>
            <option value="പുതിയടത്തിൽ ഭാഗം">പുതിയടത്തിൽ ഭാഗം</option>
            <option value="മാലോൽ ഭാഗം">മാലോൽ ഭാഗം</option>
            <option value="അരാംവള്ളി ഭാഗം">അരാംവള്ളി ഭാഗം</option>
            <option value="ലക്ഷം വീട് ഭാഗം">ലക്ഷം വീട് ഭാഗം</option>
        </select>
        <select id="rationFilter" onchange="filterData()">
            <option value="">🗂️ എല്ലാ റേഷൻ</option>
            <option value="BPL">BPL</option>
            <option value="APL">APL</option>
            <option value="AAY">AAY</option>
            <option value="OTHER">OTHER</option>
        </select>
        <select id="veedFilter" onchange="filterData()">
            <option value="">🏡 എല്ലാ തരം</option>
            <option value="സ്വന്തം">സ്വന്തം</option>
            <option value="വാടക">വാടക</option>
            <option value="കോളനി">കോളനി</option>

    <!-- Family List -->
    <div class="family-grid" id="familyDisplay">
        <div class="empty-state">
            <div class="icon">⏳</div>

</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-box" id="modalBox">
        <div class="modal-header" id="modalHeader">
            <h2 id="mhHouseName">—</h2>
            <p id="mhSubtitle">—</p>

        </div>
        <div class="modal-body" id="modalBody">
            <!-- filled dynamically -->
        </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAoVl_v1w0LWWENZ68q7HA6PBD0HZluG9Y",
        authDomain: "mahall-f0305.firebaseapp.com",
        projectId: "mahall-f0305",
        storageBucket: "mahall-f0305.firebasestorage.app",
        messagingSenderId: "1094550689039",
        appId: "1:1094550689039:web:98302a4c3f95cbaa005a7a"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    let allFamilies = [];

    /* ── Helpers ── */
    function val(v)   { return (v && String(v).trim()) ? String(v).trim() : null; }
    function disp(v, fallback = '—') { return val(v) || fallback; }

    function showStatus(msg, type) {
        const b = document.getElementById('statusBanner');
        b.textContent = msg;
        b.className = 'status-' + type;
        b.style.display = 'block';
    }
    function hideStatus() { document.getElementById('statusBanner').style.display = 'none'; }

    /* ── Firebase loader (getDocs – REST-based, no WebSocket timeout) ── */
    async function startListening() {
        showStatus("ഡേറ്റ ലോഡ് ചെയ്യുന്നു...", "loading");

        try {
            const snap = await getDocs(collection(db, "MahallCensusData"));

            if (snap.empty) {
                showStatus("ഡേറ്റ ഒന്നും ലഭ്യമല്ല. ആദ്യം Data Entry-ൽ ചേർക്കുക.", "error");
                document.getElementById('familyDisplay').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>ഡേറ്റ ഒന്നും കണ്ടെത്തിയില്ല</h3>
                        <p>ആദ്യം Data Entry Portal-ൽ വിവരങ്ങൾ ചേർക്കുക.</p>
                    </div>`;
                document.getElementById('resultCount').textContent = '0 വീടുകൾ';
                updateStats([]);
                return;
            }

            allFamilies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            // Sort by house number numerically
            allFamilies.sort((a, b) => {
                const na = parseInt(String(a.houseNumber || '0').replace(/\D/g, '')) || 0;
                const nb = parseInt(String(b.houseNumber || '0').replace(/\D/g, '')) || 0;
                return na - nb;
            });

            hideStatus();
            updateStats(allFamilies);
            renderCards(allFamilies);
            document.getElementById('resultCount').textContent = allFamilies.length + ' വീടുകൾ';

            // Auto-refresh every 30 seconds to keep data current
            setTimeout(startListening, 30000);

        } catch (err) {
            console.error("Firebase error:", err);
            showStatus("ഡേറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല: " + err.message, "error");
            // Retry after 5 seconds on error
            setTimeout(startListening, 5000);
        }
    }

    startListening();

    /* ── Stats ── */
    function updateStats(data) {
        let members = 0, males = 0, females = 0, abroad = 0, orphans = 0;
        data.forEach(f => {
            const mbs = f.members || [];
            members += mbs.length;
            mbs.forEach(m => {
                const genderTrimmed = m.gender ? String(m.gender).trim() : '';
                if (genderTrimmed === 'പുരുഷൻ') males++;
                else if (genderTrimmed === 'സ്ത്രീ') females++;
                
                const sector = m.sector ? String(m.sector).trim().toLowerCase() : '';
                if (sector && !['kerala', 'കേരളം', 'നാട്ടിൽ', 'നാട്ടില്'].includes(sector)) abroad++;
                
                const orphan = m.orphan ? String(m.orphan).trim().toLowerCase() : '';
                if (orphan === 'yes') orphans++;
            });
        });
        document.getElementById('statHouses').textContent  = data.length;
        document.getElementById('statMembers').textContent = members;
        document.getElementById('statMales').textContent   = males;
        document.getElementById('statFemales').textContent = females;
        document.getElementById('statAbroad').textContent  = abroad;
        document.getElementById('statOrphans').textContent = orphans;
    }

    /* ── Render Cards ── */
    function renderCards(data) {
        const grid = document.getElementById('familyDisplay');
        if (!data.length) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="icon">🔎</div>
                    <h3>ഒന്നും കണ്ടെത്തിയില്ല</h3>
                    <p>Filter / Search മാറ്റി നോക്കൂ.</p>
                </div>`;
            return;
        }
        grid.innerHTML = data.map(f => {
            const memberCount = (f.members || []).length;
            const maleCount   = (f.members || []).filter(m => String(m.gender).trim() === 'പുരുഷൻ').length;
            const femaleCount = (f.members || []).filter(m => String(m.gender).trim() === 'സ്ത്രീ').length;
            return `
            <div class="family-card" onclick="openDetails('${f.id}')" id="card-${f.id}">
                <div class="fc-top">
                    <span class="house-badge"># ${disp(f.houseNumber)}</span>
                    <span class="area-tag">${disp(f.place, '')}</span>
                </div>
                <div class="house-name">${disp(f.houseName, 'പേരില്ല')}</div>
                <div class="owner-name">👤 ${disp(f.Name)} &nbsp;|&nbsp; 📞 ${disp(f.mobile)}</div>
                <div class="fc-meta">
                    <span>👥 ${memberCount} അംഗം</span>
                    <span>👨 ${maleCount}</span>
                    <span>👩 ${femaleCount}</span>
                    ${disp(f.rationCard,'') ? `<span>🗂️ ${f.rationCard}</span>` : ''}
                    ${disp(f.veed,'') ? `<span>🏡 ${f.veed}</span>` : ''}
                </div>
            </div>`;
        }).join('');
    }

    /* ── Filter ── */
    window.filterData = () => {
        const search = document.getElementById('searchInput').value.toLowerCase().trim();
        const place  = document.getElementById('placeFilter').value;
        const ration = document.getElementById('rationFilter').value;
        const veed   = document.getElementById('veedFilter').value;

        const filtered = allFamilies.filter(f => {
            const matchSearch = !search || [
                f.houseName, f.Name, f.houseNumber, f.mobile, f.whatsapp, f.ward, f.father, f.place, f.veed, f.rationCard
            ].some(v => v && String(v).toLowerCase().includes(search))
              || (f.members || []).some(m => [
                  m.name, m.father, m.relation, m.blood, m.mobile, m.job, m.sector, m.place, m.skills, m.remarks, m.no
              ].some(mv => mv && String(mv).toLowerCase().includes(search)));

            const matchPlace  = !place  || f.place === place;
            const matchRation = !ration || f.rationCard === ration;
            const matchVeed   = !veed   || f.veed === veed;
            return matchSearch && matchPlace && matchRation && matchVeed;
        });

        renderCards(filtered);
        document.getElementById('resultCount').textContent = filtered.length + ' വീടുകൾ';
    };

    /* ── Open Detail Modal ── */
    window.openDetails = (id) => {
        const f = allFamilies.find(x => x.id === id);
        if (!f) return;

        document.getElementById('mhHouseName').textContent = `${disp(f.houseName)} (# ${disp(f.houseNumber)})`;
        document.getElementById('mhSubtitle').textContent  = `${disp(f.place)} · ${disp(f.Name)}`;

        const members = f.members || [];

        const memberRows = members.map((m, i) => {
            const gBadge = m.gender === 'പുരുഷൻ'
                ? `<span class="badge badge-male">👨 ${m.gender}</span>`
                : m.gender === 'സ്ത്രീ'
                ? `<span class="badge badge-female">👩 ${m.gender}</span>`
                : (m.gender || '—');

            const orphan = m.orphan === 'Yes'
                ? `<span class="badge badge-yes">Yes</span>`
                : 'No';

            const blood = m.blood ? `<span class="badge badge-blood">${m.blood}</span>` : '—';

            return `<tr>
                <td><span class="row-num">${i+1}</span></td>
                <td>${disp(m.no)}</td>
                <td><strong>${disp(m.name)}</strong></td>
                <td>${disp(m.father)}</td>
                <td>${disp(m.relation)}</td>
                <td>${gBadge}</td>
                <td>${disp(m.dob)}</td>
                <td>${disp(m.age)}</td>
                <td>${disp(m.marital)}</td>
                <td>${disp(m.sector)}</td>
                <td>${disp(m.job)}</td>
                <td>${disp(m.mobile)}</td>
                <td>${blood}</td>
                <td>${disp(m.health)}</td>
                <td>${disp(m.eduRel)}</td>
                <td>${disp(m.eduSec)}</td>
                <td>${disp(m.skills)}</td>
                <td>${orphan}</td>
                <td>${disp(m.place)}</td>
                <td>${disp(m.remarks)}</td>
            </tr>`;
        }).join('');

        document.getElementById('modalBody').innerHTML = `
            <p class="info-section-title">🏠 വീട് / കുടുംബ വിവരങ്ങൾ</p>
            <div class="info-grid">
                <div class="info-item">
                    <label>ഗൃഹ നാഥൻ/നാഥ</label>
                    <div class="val">${disp(f.Name)}</div>
                </div>
                <div class="info-item">
                    <label>പിതാവ്</label>
                    <div class="val">${disp(f.father)}</div>
                </div>
                <div class="info-item">
                    <label>വീട്ടുപേര്</label>
                    <div class="val">${disp(f.houseName)}</div>
                </div>
                <div class="info-item">
                    <label>മഹല്ല് നമ്പർ</label>
                    <div class="val">${disp(f.houseNumber)}</div>
                </div>
                <div class="info-item">
                    <label>ഏരിയ / സ്ഥലം</label>
                    <div class="val">${disp(f.place)}</div>
                </div>
                <div class="info-item">
                    <label>വാർഡ് / കെട്ടിട നമ്പർ</label>
                    <div class="val ${!val(f.ward) ? 'empty' : ''}">${disp(f.ward)}</div>
                </div>
                <div class="info-item">
                    <label>മൊബൈൽ (SMS)</label>
                    <div class="val">${disp(f.mobile)}</div>
                </div>
                <div class="info-item">
                    <label>വാട്‌സ്ആപ്പ്</label>
                    <div class="val ${!val(f.whatsapp) ? 'empty' : ''}">${disp(f.whatsapp)}</div>
                </div>
                <div class="info-item">
                    <label>താമസം</label>
                    <div class="val ${!val(f.veed) ? 'empty' : ''}">${disp(f.veed)}</div>
                </div>
                <div class="info-item">
                    <label>റേഷൻ കാർഡ്</label>
                    <div class="val ${!val(f.rationCard) ? 'empty' : ''}">${disp(f.rationCard)}</div>
                </div>
            </div>

            <p class="info-section-title">👥 അംഗങ്ങളുടെ വിവരങ്ങൾ (${members.length} പേർ)</p>
            ${members.length === 0 ? `<div class="remarks-box" style="text-align:center;">ഒരു അംഗം ചേർത്തിട്ടില്ല.</div>` : `
            <div class="members-table-wrap">
                <table class="members-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>അംഗത്വ No</th>
                            <th>പേര്</th>
                            <th>പിതാവ്</th>
                            <th>ബന്ധം</th>
                            <th>ലിംഗം</th>
                            <th>ജനന തീയ്യതി</th>
                            <th>வயസ്സ്</th>
                            <th>വൈവാഹികം</th>
                            <th>ജോലി മേഖല</th>
                            <th>ജോലി</th>
                            <th>മൊബൈൽ</th>
                            <th>ബ്ലഡ്</th>
                            <th>ആരോഗ്യം</th>
                            <th>മത വിദ്യ.</th>
                            <th>ഭൗതിക വിദ്യ.</th>
                            <th>സ്കിൽസ്</th>
                            <th>യത്തീം</th>
                            <th>സ്ഥലം</th>
                            <th>റീമാർക്</th>
                        </tr>
                    </thead>
                    <tbody>${memberRows}</tbody>
                </table>
            </div>`}

            ${val(f.remarks) ? `
            <p class="info-section-title">📝 കുറിപ്പ്</p>
            <div class="remarks-box">${f.remarks}</div>` : ''}

            <div class="modal-footer">
                <button class="btn-pdf" onclick="downloadPDF('${f.id}')">📄 PDF ഡൗൺലോഡ്</button>
                <button class="btn-print" onclick="printFamily('${f.id}')">🖨️ Print</button>
            </div>
        `;

        document.getElementById('detailModal').classList.add('active');
        document.body.style.overflow = 'hidden';
    };

    window.closeModal = () => {
        document.getElementById('detailModal').classList.remove('active');
        document.body.style.overflow = '';
    };

    // Close on overlay click
    document.getElementById('detailModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('detailModal')) window.closeModal();
    });

    // Escape key
    document.addEventListener('keydown', e => { if (e.key === 'Escape') window.closeModal(); });

    /* ── PDF Download ── */
    window.downloadPDF = (id) => {
        const f = allFamilies.find(x => x.id === id);
        if (!f) return;

        const members = f.members || [];
        const memberRows = members.map((m, i) => `
            <tr>
                <td>${i+1}</td>
                <td>${disp(m.no)}</td>
                <td>${disp(m.name)}</td>
                <td>${disp(m.father)}</td>
                <td>${disp(m.relation)}</td>
                <td>${disp(m.gender)}</td>
                <td>${disp(m.dob)}</td>
                <td>${disp(m.age)}</td>
                <td>${disp(m.marital)}</td>
                <td>${disp(m.sector)}</td>
                <td>${disp(m.job)}</td>
                <td>${disp(m.mobile)}</td>
                <td>${disp(m.blood)}</td>
                <td>${disp(m.health)}</td>
                <td>${disp(m.eduRel)}</td>
                <td>${disp(m.eduSec)}</td>
                <td>${disp(m.skills)}</td>
                <td>${disp(m.orphan)}</td>
                <td>${disp(m.place)}</td>
                <td>${disp(m.remarks)}</td>

        const pdfEl = document.createElement('div');
        pdfEl.innerHTML = `
        <div style="font-family:Arial,sans-serif; font-size:12px; padding:20px;">
            <div style="text-align:center; border-bottom:3px solid #10b981; padding-bottom:14px; margin-bottom:18px;">
                <h2 style="font-size:18px; margin:0;">EARIAL MAHALLU MUSLIM JAMA-ATH</h2>
                <p style="margin:4px 0; color:#555;">Census Family Report</p>
            </div>
            <table style="width:100%; border-collapse:collapse; margin-bottom:16px; font-size:12px;">
                <tr><td style="padding:5px; width:50%;"><b>ഗൃഹ നാഥൻ/നാഥ:</b> ${disp(f.Name)}</td><td style="padding:5px;"><b>പിതാവ്:</b> ${disp(f.father)}</td></tr>
                <tr><td style="padding:5px;"><b>വീട്ടുപേര്:</b> ${disp(f.houseName)}</td><td style="padding:5px;"><b>മഹല്ല് നമ്പർ:</b> ${disp(f.houseNumber)}</td></tr>
                <tr><td style="padding:5px;"><b>ഏരിയ:</b> ${disp(f.place)}</td><td style="padding:5px;"><b>മൊബൈൽ:</b> ${disp(f.mobile)}</td></tr>
                <tr><td style="padding:5px;"><b>വാട്‌സ്ആപ്പ്:</b> ${disp(f.whatsapp)}</td><td style="padding:5px;"><b>വാർഡ്:</b> ${disp(f.ward)}</td></tr>
                <tr><td style="padding:5px;"><b>താമസം:</b> ${disp(f.veed)}</td><td style="padding:5px;"><b>റേഷൻ കാർഡ്:</b> ${disp(f.rationCard)}</td></tr>
            </table>
            <h3 style="font-size:13px; border-bottom:1px solid #eee; padding-bottom:6px; margin-bottom:10px;">
                👥 അംഗങ്ങൾ (${members.length} പേർ)
            </h3>
            <table style="width:100%; border-collapse:collapse; font-size:10px;">
                <thead>
                    <tr style="background:#f1f5f9;">
                        <th style="border:1px solid #ddd; padding:5px;">#</th>
                        <th style="border:1px solid #ddd; padding:5px;">അംഗത്വ No</th>
                        <th style="border:1px solid #ddd; padding:5px;">പേര്</th>
                        <th style="border:1px solid #ddd; padding:5px;">പിതാവ്</th>
                        <th style="border:1px solid #ddd; padding:5px;">ബന്ധം</th>
                        <th style="border:1px solid #ddd; padding:5px;">ലിംഗം</th>
                        <th style="border:1px solid #ddd; padding:5px;">DOB</th>
                        <th style="border:1px solid #ddd; padding:5px;">വയസ്സ്</th>
                        <th style="border:1px solid #ddd; padding:5px;">വൈവാഹിക</th>
                        <th style="border:1px solid #ddd; padding:5px;">മേഖല</th>
                        <th style="border:1px solid #ddd; padding:5px;">ജോലി</th>
                        <th style="border:1px solid #ddd; padding:5px;">Mobile</th>
                        <th style="border:1px solid #ddd; padding:5px;">Blood</th>
                        <th style="border:1px solid #ddd; padding:5px;">ആരോഗ്യം</th>
                        <th style="border:1px solid #ddd; padding:5px;">മത വിദ്യ.</th>
                        <th style="border:1px solid #ddd; padding:5px;">ഭൗ. വിദ്യ.</th>
                        <th style="border:1px solid #ddd; padding:5px;">സ്കിൽസ്</th>
                        <th style="border:1px solid #ddd; padding:5px;">യത്തീം</th>
                        <th style="border:1px solid #ddd; padding:5px;">സ്ഥലം</th>
                        <th style="border:1px solid #ddd; padding:5px;">റീമാർക്</th>
                    </tr>
                </thead>
                <tbody>${memberRows}</tbody>
            </table>
            ${val(f.remarks) ? `<p style="margin-top:12px;"><b>കുറിപ്പ്:</b> ${f.remarks}</p>` : ''}
            <p style="text-align:right; color:#999; font-size:9px; margin-top:16px;">
                Generated: ${new Date().toLocaleDateString('ml-IN')}
            </p>
        </div>`;

        html2pdf().set({
            margin: 8,
            filename: `Mahall_${f.houseName || f.houseNumber || 'Family'}.pdf`,
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        }).from(pdfEl).save();
    };

    /* ── Print ── */
    window.printFamily = (id) => {
        const f = allFamilies.find(x => x.id === id);
        if (!f) return;
        const members = f.members || [];
        const win = window.open('', '_blank');
        win.document.write(`<html><head><title>Print - ${disp(f.houseName)}</title>
        <style>
            body { font-family: Arial, sans-serif; font-size: 12px; padding: 20px; }
            table { border-collapse: collapse; width: 100%; font-size: 10px; }

        </style></head><body>
        <div style="text-align:center; border-bottom:2px solid #10b981; padding-bottom:10px; margin-bottom:15px;">
            <h2>EARIAL MAHALLU MUSLIM JAMA-ATH</h2>
            <p>${disp(f.houseName)} — # ${disp(f.houseNumber)} — ${disp(f.place)}</p>
        </div>
        <p><b>ഗൃഹ നാഥൻ/നാഥ:</b> ${disp(f.Name)} &nbsp;&nbsp; <b>മൊബൈൽ:</b> ${disp(f.mobile)} &nbsp;&nbsp; <b>വൈ/ആ:</b> ${disp(f.whatsapp)} &nbsp;&nbsp; <b>റേഷൻ:</b> ${disp(f.rationCard)} &nbsp;&nbsp; <b>താമസം:</b> ${disp(f.veed)}</p>
        <br>
        <table>
            <thead><tr>
                <th>#</th><th>No</th><th>പേര്</th><th>പിതാവ്</th><th>ബന്ധം</th><th>ലിംഗം</th>
                <th>DOB</th><th>വയസ്സ്</th><th>വൈ/സ്ഥ</th><th>മേഖല</th><th>ജോലി</th>
                <th>Mobile</th><th>Blood</th><th>ആരോഗ്യം</th><th>മത.വിദ്യ</th><th>ഭൗ.വിദ്യ</th><th>സ്കിൽസ്</th><th>യത്തീം</th><th>സ്ഥലം</th><th>റീമാർക്</th>
            </tr></thead>
            <tbody>
            ${members.map((m,i) => `<tr>
                <td>${i+1}</td>
                <td>${disp(m.no)}</td>
                <td>${disp(m.name)}</td><td>${disp(m.father)}</td><td>${disp(m.relation)}</td>
                <td>${disp(m.gender)}</td><td>${disp(m.dob)}</td><td>${disp(m.age)}</td>
                <td>${disp(m.marital)}</td><td>${disp(m.sector)}</td><td>${disp(m.job)}</td>
                <td>${disp(m.mobile)}</td><td>${disp(m.blood)}</td><td>${disp(m.health)}</td>
                <td>${disp(m.eduRel)}</td><td>${disp(m.eduSec)}</td><td>${disp(m.skills)}</td><td>${disp(m.orphan)}</td><td>${disp(m.place)}</td><td>${disp(m.remarks)}</td>
            </tr>`).join('')}
            </tbody>
        </table>
        ${val(f.remarks) ? `<p style="margin-top:12px;"><b>കുറിപ്പ്:</b> ${f.remarks}</p>` : ''}

        win.document.close();
        win.print();

</script>
</body>
</html>
